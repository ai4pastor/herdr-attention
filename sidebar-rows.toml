# herdr-attention 사이드바 줄 구성 — ~/.config/herdr/config.toml 에 붙여 넣는다.
# 이미 [ui.sidebar.agents] 나 [ui.sidebar.agents.rows_by_agent] 가 있으면 그 부분을 이것으로 바꾼다
# (같은 이름의 표가 두 번 있으면 herdr가 설정을 읽지 못한다).
# 넣은 뒤: herdr config check → herdr server reload-config
#
# 줄 맨 앞의 큰 색 표시는 herdr-attention 플러그인이 칸마다 써 넣는다:
# 빨강 █ 입력 필요 · 노랑 █ 확인 안 함 · 초록 ✓ 확인함 · 파랑 ◐ 작업 중

[ui.sidebar.agents]
rows = [
  [{ token = "$att_red", fg = "#ff453a", bold = true }, { token = "$att_yellow", fg = "#ffd60a", bold = true }, { token = "$att_green", fg = "#30d158" }, { token = "$att_blue", fg = "#64d2ff" }, "workspace", "tab"],
  ["agent"],
]

# 사이드바에 "claude" 대신 각 세션이 하는 일(대화 제목)이 보이게
[ui.sidebar.agents.rows_by_agent]
claude = [
  [{ token = "$att_red", fg = "#ff453a", bold = true }, { token = "$att_yellow", fg = "#ffd60a", bold = true }, { token = "$att_green", fg = "#30d158" }, { token = "$att_blue", fg = "#64d2ff" }, "workspace", "tab"],
  ["terminal_title_stripped"],
]
codex = [
  [{ token = "$att_red", fg = "#ff453a", bold = true }, { token = "$att_yellow", fg = "#ffd60a", bold = true }, { token = "$att_green", fg = "#30d158" }, { token = "$att_blue", fg = "#64d2ff" }, "workspace", "tab"],
  ["terminal_title_stripped"],
]
